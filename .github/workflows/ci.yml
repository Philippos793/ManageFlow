# Name shown in the GitHub "Actions" tab and in the README badge
name: CI

# When the workflow runs
on:
  push:
    branches: [main]        # every push to main
  pull_request:
    branches: [main]        # every pull request that targets main

# The workflow only needs to read the code (least privilege)
permissions:
  contents: read

# If a new commit is pushed to the same branch/PR while a run is still going,
# cancel the old run and keep only the newest one (saves CI minutes)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Job 1: Spring Boot backend ----------
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest              # a fresh Linux VM provided by GitHub
    defaults:
      run:
        working-directory: employee-management-backend   # run commands inside the backend folder
    steps:
      # 1. Download the repository code onto the VM
      - uses: actions/checkout@v4

      # 2. Install Java 21 (same version as pom.xml) and cache Maven dependencies
      #    so later runs don't download them again
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 3. Compile, run all tests, and package the JAR.
      #    If any test fails, this step fails and the whole run turns red.
      #    (Docker is available here, so the Testcontainers PostgreSQL test also runs.)
      - name: Build and test
        run: ./mvnw -B verify

  # ---------- Job 2: React frontend ----------
  # Runs in parallel with the backend job
  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: employee-management-frontend
    steps:
      # 1. Download the repository code
      - uses: actions/checkout@v4

      # 2. Install Node 22 and cache npm packages
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: employee-management-frontend/package-lock.json

      # 3. Install the exact dependency versions from package-lock.json
      - run: npm ci

      # 4. Check code style / common mistakes
      - run: npm run lint

      # 5. Run the Vitest + React Testing Library tests
      - run: npm test

      # 6. Make sure the production build succeeds.
      #    VITE_API_URL is just the public backend address, not a secret.
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080

  # ---------- Job 3: Docker images ----------
  # Builds the same images that docker compose uses, to prove the
  # Dockerfiles still work. Runs only after both jobs above pass.
  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]          # wait for backend and frontend to succeed first
    steps:
      # 1. Download the repository code
      - uses: actions/checkout@v4

      # 2. Build the backend image (multi-stage: Maven build -> slim JRE runtime)
      - name: Build backend image
        run: docker build -t manageflow-backend ./employee-management-backend

      # 3. Build the frontend image (Node build -> Nginx serving the static files).
      #    The images are only built to verify them; nothing is pushed to a registry.
      - name: Build frontend image
        run: docker build --build-arg VITE_API_URL=http://localhost:8080 -t manageflow-frontend ./employee-management-frontend
