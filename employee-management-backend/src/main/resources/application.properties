spring.application.name=employee-management-backend
jwt.expiration=86400000
app.business-time-zone=${BUSINESS_TIME_ZONE:Europe/Athens}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.task-attachments.storage-path=${TASK_ATTACHMENT_STORAGE_PATH:uploads/task-attachments}
app.task-attachments.max-file-size-bytes=${TASK_ATTACHMENT_MAX_FILE_SIZE_BYTES:10485760}
spring.servlet.multipart.max-file-size=${TASK_ATTACHMENT_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${TASK_ATTACHMENT_MAX_REQUEST_SIZE:10MB}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
